[tools]
go = "1.27.1"
goreleaser = "2.17.0"
svu = "3.3.0"

[tasks.install]
description = "Tidy and download Go modules"
run = "go mod tidy && go get -v ./..."

[tasks.format]
description = "Format Go packages"
run = "go fmt ./..."

[tasks.lint]
description = "Run go vet"
run = "go vet ./..."

[tasks.test]
description = "Run Go tests"
run = "go test ./..."

[tasks.build]
description = "Build herdr-reflow"
run = "go build -o bin/herdr-reflow ./cmd/herdr-reflow"

[tasks.ci]
description = "Lint, test, and build"
depends = ["lint", "test", "build"]

[tasks.release]
description = "Tag with svu and publish with goreleaser"
depends = ["ci"]
usage = '''
arg "<version>" help="New version" {
  choices "next" "major" "minor" "patch"
  default "next"
}
'''
run = '''
git tag $(svu ${usage_version})
goreleaser release --clean
'''
